<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglês Live</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--on-acc:#0f172a;--ok:#4ade80;--warn:#fbbf24}
:root[data-theme=light]{--bg:#f8fafc;--panel:#fff;--line:#cbd5e1;--txt:#0f172a;--mut:#64748b;--acc:#0284c7;--on-acc:#fff;--ok:#16a34a;--warn:#b45309}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f8fafc;--panel:#fff;--line:#cbd5e1;--txt:#0f172a;--mut:#64748b;--acc:#0284c7;--on-acc:#fff;--ok:#16a34a;--warn:#b45309}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:12px 0;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}
select,input,button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{cursor:pointer}
#cfg{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;gap:10px;flex-direction:column}
#cfg.on{display:flex}
#cfg label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--acc);color:var(--on-acc);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.note{align-self:flex-start;max-width:88%;font-size:14px;border-left:3px solid var(--warn);padding:4px 10px}
.note.tip{border-color:var(--ok)}
.note b{color:var(--mut);font-weight:600}
.sys{align-self:center;color:var(--mut);font-size:14px;text-align:center}
#live{min-height:28px;text-align:center;color:var(--mut);font-style:italic;padding:4px}
#bar{display:flex;gap:8px;align-items:center;padding:8px 0 12px}
#txt{flex:1;min-width:0}
#mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);font-size:26px;flex:none;transition:.15s}
#mic.listen{background:var(--ok);box-shadow:0 0 0 8px rgba(74,222,128,.25)}
#mic.speak{background:var(--warn)}
#mic.think{background:var(--mut)}
#st{text-align:center;font-size:13px;color:var(--mut);min-height:18px}
</style>
</head>
<body>
<header>
  <h1>🎙️ Inglês Live</h1>
  <select id="nivel" aria-label="Nível">
    <option value="iniciante">Iniciante</option>
    <option value="intermediario">Intermediário</option>
    <option value="avancado">Avançado</option>
  </select>
  <select id="tema" aria-label="Tema">
    <option value="free casual conversation">Conversa livre</option>
    <option value="job interview (the tutor is the interviewer)">Entrevista de emprego</option>
    <option value="at the airport and travelling">Aeroporto e viagem</option>
    <option value="ordering at a restaurant (the tutor is the waiter)">Restaurante</option>
    <option value="business meeting and small talk at work">Reunião de trabalho</option>
    <option value="shopping and asking for prices (the tutor is a shop assistant)">Compras</option>
  </select>
  <button id="gear" aria-label="Configurações">⚙️</button>
</header>
<div id="cfg">
  <label>Endereço do Worker (ponte com a IA)<input id="url" placeholder="https://ingles-live.SEU-USUARIO.workers.dev"></label>
  <label>Voz da IA<select id="voz"></select></label>
  <label>Velocidade da voz: <span id="velv">0.9</span><input id="vel" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
  <label><span><input id="falar" type="checkbox" checked> IA responde falando</span></label>
  <label><span><input id="pt" type="checkbox" checked> Mostrar correções e dicas em português</span></label>
</div>
<div id="log"><div class="sys">Toque no microfone e fale em inglês. Eu respondo por voz e mostro tudo em texto. Se errar, eu corrijo. 🙂</div></div>
<div id="live"></div>
<div id="st"></div>
<div id="bar">
  <input id="txt" placeholder="…ou digite aqui" autocomplete="off">
  <button id="send">Enviar</button>
  <button id="mic" aria-label="Falar">🎤</button>
</div>
<script>
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;
let hist = [], ativo = false, ocupado = false, falando = false, rec = null, voz = null;

$("url").value = store.get("url", "");
$("url").onchange = () => store.set("url", $("url").value.trim().replace(/\/$/, ""));
$("nivel").value = store.get("nivel", "intermediario");
$("nivel").onchange = () => store.set("nivel", $("nivel").value);
$("tema").value = store.get("tema", $("tema").options[0].value);
if (!$("tema").value) $("tema").selectedIndex = 0;
$("tema").onchange = () => { store.set("tema", $("tema").value); hist = []; add("sys", "Novo tema: " + $("tema").selectedOptions[0].text); };
$("vel").value = store.get("vel", "0.9"); $("velv").textContent = $("vel").value;
$("vel").oninput = () => { $("velv").textContent = $("vel").value; store.set("vel", $("vel").value); };
$("gear").onclick = () => $("cfg").classList.toggle("on");

function carregarVozes() {
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  const sel = $("voz"), salva = store.get("voz", "");
  sel.innerHTML = vs.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join("");
  voz = vs.find(v => v.name === salva)
    || vs.find(v => /en-US/.test(v.lang) && /natural|neural|google|samantha|aria|jenny/i.test(v.name))
    || vs.find(v => /en-US/.test(v.lang)) || vs[0] || null;
  if (voz) sel.value = voz.name;
}
if (synth) { carregarVozes(); synth.onvoiceschanged = carregarVozes; }
$("voz").onchange = () => { store.set("voz", $("voz").value); carregarVozes(); };

function add(tipo, texto) {
  const d = document.createElement("div");
  if (tipo === "corr" || tipo === "tip") {
    d.className = "note" + (tipo === "tip" ? " tip" : "");
    const b = document.createElement("b"); b.textContent = (tipo === "tip" ? "💡 Dica" : "✏️ Correção") + ": ";
    d.append(b, document.createTextNode(texto));
  } else {
    d.className = tipo === "u" ? "m u" : tipo === "a" ? "m a" : "sys";
    d.textContent = texto;
  }
  $("log").append(d); $("log").scrollTop = $("log").scrollHeight;
}
function estado(cls, msg) { $("mic").className = cls || ""; $("st").textContent = msg || ""; }

function ouvir() {
  if (!ativo || ocupado || falando || !SR) return;
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  let final = "";
  rec.onstart = () => estado("listen", "Ouvindo… fale em inglês");
  rec.onresult = e => {
    let parcial = "";
    for (const r of e.results) { if (r.isFinal) final += r[0].transcript; else parcial += r[0].transcript; }
    $("live").textContent = (final + " " + parcial).trim();
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { parar(); add("sys", "Permita o uso do microfone no navegador."); }
  };
  rec.onend = () => {
    $("live").textContent = "";
    const t = final.trim();
    if (t) enviar(t); else if (ativo && !ocupado && !falando) setTimeout(ouvir, 250);
  };
  try { rec.start(); } catch {}
}

async function enviar(texto) {
  const url = store.get("url", "");
  if (!url) { add("sys", "Configure o endereço do Worker em ⚙️ primeiro."); $("cfg").classList.add("on"); parar(); return; }
  add("u", texto); hist.push({ role: "user", content: texto });
  ocupado = true; estado("think", "Pensando…");
  try {
    const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: hist, nivel: $("nivel").value, tema: $("tema").value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || r.status);
    hist.push({ role: "assistant", content: j.reply }); add("a", j.reply);
    if (j.correction && $("pt").checked) add("corr", j.correction);
    if (j.tip && $("pt").checked) add("tip", j.tip);
    ocupado = false;
    if ($("falar").checked && synth) falar(j.reply); else { estado(ativo ? "listen" : ""); ouvir(); }
  } catch (e) {
    hist.pop(); ocupado = false; add("sys", "Erro: " + e.message); estado(""); if (ativo) setTimeout(ouvir, 800);
  }
}

function falar(t) {
  synth.cancel(); falando = true; estado("speak", "Falando… (toque no 🎤 para interromper)");
  const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = parseFloat($("vel").value); if (voz) u.voice = voz;
  u.onend = u.onerror = () => { falando = false; if (ativo) setTimeout(ouvir, 200); else estado(""); };
  synth.speak(u);
}

function parar() { ativo = false; try { rec && rec.abort(); } catch {} if (synth) synth.cancel(); falando = false; $("live").textContent = ""; estado(""); }

$("mic").onclick = () => {
  if (!SR) { add("sys", "Este navegador não reconhece voz. Use Chrome ou Edge (ou digite)."); return; }
  if (falando) { synth.cancel(); return; }   // interromper a IA
  if (ativo) { parar(); return; }
  ativo = true; ouvir();
};
$("send").onclick = () => { const t = $("txt").value.trim(); if (t && !ocupado) { $("txt").value = ""; enviar(t); } };
$("txt").onkeydown = e => { if (e.key === "Enter") $("send").onclick(); };
if (!SR) add("sys", "⚠️ Voz não suportada neste navegador — use Chrome/Edge, ou converse digitando.");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
